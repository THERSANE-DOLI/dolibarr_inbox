<!doctype html>
<!--
	Developer page to choose Tabler icons for inbox. Template of dev/bin/icon-picker.html, built by
	php dev/build-icons.php --picker (the data of the full package replaces the DATA marker). Not shipped, not served.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icônes inbox</title>
<style>
:root {
	--bg: #ffffff; --pane: #f6f8f9; --line: #d5dde1; --text: #1b2328; --muted: #4b5a61;
	--accent: #1d6a8a; --accent-soft: #e3eff4; --on-accent: #ffffff; --used: #2f855a; --used-soft: #e7f5ee;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #151c20; --pane: #1b2328; --line: #33424a; --text: #e6edf0; --muted: #a1b0b6;
		--accent: #4fa8c9; --accent-soft: #1d3540; --on-accent: #081a22; --used: #5cc28c; --used-soft: #173026;
		color-scheme: dark;
	}
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif; background: var(--bg); color: var(--text); }
header { position: sticky; top: 0; z-index: 2; background: var(--pane); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; }
header .muted { color: var(--muted); font-size: 12px; }
input, select, button { font: inherit; color: inherit; }
input[type="search"], select, .usage { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
input[type="search"] { width: 18rem; max-width: 100%; }
label.opt { display: inline-flex; gap: 6px; align-items: center; }
button { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button:focus-visible, input:focus-visible, select:focus-visible, .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; grid-template-columns: 1fr 22rem; min-height: calc(100vh - 60px); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position: static !important; max-height: none !important; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 4px; padding: 12px 16px; align-content: start; }
.cell { content-visibility: auto; contain-intrinsic-size: 96px 92px; border: 1px solid transparent; border-radius: 6px; background: none; padding: 10px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.cell:hover { background: var(--pane); border-color: var(--line); }
.cell svg { width: var(--size, 28px); height: var(--size, 28px); stroke-width: var(--stroke, 2); }
.cell .name { font-size: 11px; color: var(--muted); word-break: break-word; line-height: 1.2; }
.cell.is-used { background: var(--used-soft); }
.cell.is-used .name { color: var(--used); font-weight: 600; }
.cell[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.cell .badge { font-size: 10px; color: var(--muted); }
aside { border-left: 1px solid var(--line); background: var(--pane); padding: 12px 16px; position: sticky; top: 60px; max-height: calc(100vh - 60px); overflow: auto; }
aside h2 { font-size: 14px; margin: 0 0 8px; }
.pick { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.pick svg { width: 24px; height: 24px; stroke-width: 2; }
.pick .usage { width: 100%; padding: 4px 6px; }
.pick .src { grid-column: 2 / 4; font-size: 11px; color: var(--muted); }
.remove { border: 0; background: none; padding: 4px 6px; color: var(--muted); }
textarea { width: 100%; min-height: 8rem; font: 12px/1.4 ui-monospace, monospace; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
.empty { color: var(--muted); padding: 24px 16px; }
.count { color: var(--muted); }
.help { color: var(--muted); font-size: 12px; margin: 8px 0; }
</style>
</head>
<body>
<header>
	<h1>Icônes inbox</h1>
	<span class="muted" id="version"></span>
	<input type="search" id="q" placeholder="Nom, mot-clé (anglais) : certificate, award…" aria-label="Rechercher une icône" autofocus>
	<select id="cat" aria-label="Catégorie"><option value="">Toutes les catégories</option></select>
	<select id="style" aria-label="Style">
		<option value="o">Au trait</option>
		<option value="f">Pleines</option>
		<option value="of">Les deux</option>
	</select>
	<select id="size" aria-label="Taille">
		<option value="16px">16 px (arbre)</option>
		<option value="28px" selected>28 px</option>
		<option value="48px">48 px</option>
	</select>
	<label class="opt"><input type="checkbox" id="onlyUsed"> Déjà dans inbox</label>
	<span class="count" id="count" aria-live="polite"></span>
</header>
<main>
	<div>
		<div class="grid" id="grid" role="list"></div>
		<div class="empty" id="empty" hidden>Aucune icône ne correspond. Les mots-clés de Tabler sont en anglais.</div>
	</div>
	<aside aria-labelledby="selTitle">
		<h2 id="selTitle">Sélection (<span id="selCount">0</span>)</h2>
		<p class="help">Cliquer une icône l'ajoute ou la retire. Le nom d'usage devient <code>ibx-i-&lt;nom&gt;</code> dans inbox.
			Coller les lignes dans <code>dev/icons.json</code> (bloc <code>icons</code>), puis <code>php dev/build-icons.php</code>.</p>
		<div id="picks"></div>
		<p><button type="button" class="primary" id="copy">Copier les lignes</button> <button type="button" id="clear">Vider</button></p>
		<textarea id="out" readonly aria-label="Lignes pour dev/icons.json"></textarea>
	</aside>
</main>
<script>
(function () {
	'use strict';
	const DATA = /*DATA*/null;
	const $ = id => document.getElementById(id);
	const names = Object.keys(DATA.icons);
	const STORE = 'inbox-icon-picker';
	let picks = [];
	try {
		picks = JSON.parse(localStorage.getItem(STORE) || '[]') || [];
	} catch (e) {
		picks = [];
	}

	$('version').textContent = 'Tabler Icons ' + DATA.version + ' · ' + names.length + ' icônes · MIT';
	[...new Set(names.map(n => DATA.icons[n].c).filter(Boolean))].sort().forEach(c => {
		const o = document.createElement('option');
		o.value = c;
		o.textContent = c;
		$('cat').appendChild(o);
	});

	const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
	const svg = (name, st) => st === 'f'
		? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + DATA.icons[name].f + '</svg>'
		: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + DATA.icons[name].o + '</svg>';
	const styleName = st => (st === 'f' ? 'filled' : 'outline');
	const usedBy = (name, st) => DATA.used[name + '|' + styleName(st)] || [];
	const picked = (name, st) => picks.findIndex(p => p.name === name && p.st === st);

	function save() {
		try {
			localStorage.setItem(STORE, JSON.stringify(picks));
		} catch (e) {
			// Selection kept for this visit only
		}
	}

	function render() {
		const words = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
		const cat = $('cat').value;
		const styles = $('style').value.split('');
		const onlyUsed = $('onlyUsed').checked;
		let html = '';
		let n = 0;
		names.forEach(name => {
			const ic = DATA.icons[name];
			if (cat && ic.c !== cat) {
				return;
			}
			const hay = (name + ' ' + ic.t + ' ' + ic.c).toLowerCase();
			if (words.some(w => !hay.includes(w))) {
				return;
			}
			styles.forEach(st => {
				if (!ic[st]) {
					return;
				}
				const used = usedBy(name, st);
				if (onlyUsed && !used.length) {
					return;
				}
				n++;
				html += '<button type="button" role="listitem" class="cell' + (used.length ? ' is-used' : '') + '" data-name="' + esc(name) + '" data-st="' + st + '" aria-pressed="' + (picked(name, st) >= 0) + '"'
					+ ' title="' + esc(name + (st === 'f' ? ' (pleine)' : '') + (ic.t ? '\n' + ic.t : '') + (used.length ? '\nDéjà dans inbox : ' + used.join(', ') : '')) + '">'
					+ svg(name, st) + '<span class="name">' + esc(used.length ? used.join(', ') : name) + '</span>'
					+ (st === 'f' && styles.length > 1 ? '<span class="badge">pleine</span>' : '') + '</button>';
			});
		});
		$('grid').innerHTML = html;
		$('empty').hidden = n > 0;
		$('count').textContent = n + ' affichée' + (n > 1 ? 's' : '');
	}

	function renderPicks() {
		$('selCount').textContent = picks.length;
		$('picks').innerHTML = picks.map((p, i) => '<div class="pick">' + svg(p.name, p.st)
			+ '<input class="usage" data-i="' + i + '" value="' + esc(p.usage) + '" aria-label="Nom d\'usage de ' + esc(p.name) + '" pattern="[a-z0-9-]+">'
			+ '<button type="button" class="remove" data-i="' + i + '" aria-label="Retirer ' + esc(p.name) + '">✕</button>'
			+ '<span class="src">' + esc(p.name) + ' · ' + styleName(p.st) + (usedBy(p.name, p.st).length ? ' · déjà : ' + esc(usedBy(p.name, p.st).join(', ')) : '') + '</span></div>').join('');
		$('out').value = picks.map(p => '\t\t"' + p.usage + '": ["' + p.name + '", "' + styleName(p.st) + '"],').join('\n');
	}

	$('grid').addEventListener('click', e => {
		const cell = e.target.closest('.cell');
		if (!cell) {
			return;
		}
		const name = cell.dataset.name;
		const st = cell.dataset.st;
		const i = picked(name, st);
		if (i >= 0) {
			picks.splice(i, 1);
		} else {
			picks.push({ name, st, usage: name + (st === 'f' ? '-filled' : '') });
		}
		cell.setAttribute('aria-pressed', String(i < 0));
		save();
		renderPicks();
	});
	$('picks').addEventListener('input', e => {
		if (e.target.classList.contains('usage')) {
			picks[+e.target.dataset.i].usage = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
			save();
			$('out').value = picks.map(p => '\t\t"' + p.usage + '": ["' + p.name + '", "' + styleName(p.st) + '"],').join('\n');
		}
	});
	$('picks').addEventListener('click', e => {
		const b = e.target.closest('.remove');
		if (b) {
			picks.splice(+b.dataset.i, 1);
			save();
			renderPicks();
			render();
		}
	});
	$('copy').addEventListener('click', async () => {
		const text = $('out').value;
		try {
			await navigator.clipboard.writeText(text);
		} catch (e) {
			$('out').select();
			document.execCommand('copy');
		}
		$('copy').textContent = 'Copié';
		setTimeout(() => {
			$('copy').textContent = 'Copier les lignes';
		}, 1500);
	});
	$('clear').addEventListener('click', () => {
		picks = [];
		save();
		renderPicks();
		render();
	});
	let timer = 0;
	$('q').addEventListener('input', () => {
		clearTimeout(timer);
		timer = setTimeout(render, 120);
	});
	['cat', 'style', 'onlyUsed'].forEach(id => $(id).addEventListener('change', render));
	$('size').addEventListener('change', () => document.body.style.setProperty('--size', $('size').value));
	render();
	renderPicks();
})();
</script>
</body>
</html>
