# Local test server of inbox (never a real mailbox). Plain IMAP on 143 and ManageSieve on 4190, inside the
# container only; published on 127.0.0.1 by run.sh.
protocols = imap sieve submission
listen = *
log_path = /dev/stderr
disable_plaintext_auth = no
auth_mechanisms = plain login
ssl = no
mail_location = maildir:/srv/mail/%d/%n
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
namespace inbox {
  inbox = yes
  separator = .
  prefix = INBOX.
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archives {
    special_use = \Archive
    auto = subscribe
  }
}
# Master user (login "box*inboxmaster"), as the master mode of inbox
auth_master_user_separator = *
passdb {
  driver = passwd-file
  args = /etc/dovecot/master-users
  master = yes
  result_success = continue
}
passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%d/%n
}
mail_plugins = $mail_plugins quota
protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 50
}
plugin {
  quota = maildir:User quota
  quota_rule = *:storage=100M
  sieve = file:~/sieve;active=~/.dovecot.sieve
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
# SMTP submission (port 587): relays to the Mailpit container of dev/dovecot/run.sh, which delivers nothing
submission_relay_host = inbox-mailpit
submission_relay_port = 1025
# Dolibarr (smtps) writes « MAIL FROM: <address> », a space RFC 5321 does not allow: accepted, as most servers do
submission_client_workarounds = whitespace-before-path
hostname = inbox-test.invalid
