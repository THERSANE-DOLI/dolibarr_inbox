# Branch « edge »: the module as deployed (Git deployment of Plesk), without dev/ nor test/.
# Built at each push on develop from git archive (entries export-ignore of .gitattributes), one commit per push on top
# of the previous build, so that a deployment by git pull always moves forward.
# Not the published versions (tags, GitHub releases, branch stable), see release.yml; nor the release candidate
# (branch rc on the newest X.Y), see rc.yml.
name: deploy

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - name: Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build the branch edge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha=$(git rev-parse --short HEAD)
          subject=$(git log -1 --format=%s HEAD)
          git archive --format=tar HEAD > /tmp/module.tar
          if git ls-remote --exit-code --heads origin edge >/dev/null; then
            git fetch origin edge
            git worktree add /tmp/edge origin/edge
            git -C /tmp/edge checkout -B edge
          else
            git worktree add --detach /tmp/edge
            git -C /tmp/edge checkout --orphan edge
          fi
          # Everything replaced by the archive: files removed from develop go away too
          git -C /tmp/edge rm -rq --ignore-unmatch . || true
          find /tmp/edge -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf /tmp/module.tar -C /tmp/edge
          git -C /tmp/edge add -A
          if git -C /tmp/edge diff --cached --quiet; then
            echo "Nothing changed for the deployment"
            exit 0
          fi
          git -C /tmp/edge commit -q -m "Edge ${sha}: ${subject}"
          git -C /tmp/edge push origin edge
