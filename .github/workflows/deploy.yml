# Branch « release »: the module as deployed (Git deployment of Plesk), without dev/ nor test/.
# Built at each push on develop from git archive (entries export-ignore of .gitattributes), one commit per push on top
# of the previous release, so that a deployment by git pull always moves forward.
# Not the published versions (tags, GitHub releases, branches stable and X.Y): see release.yml.
name: deploy

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the branch release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha=$(git rev-parse --short HEAD)
          subject=$(git log -1 --format=%s HEAD)
          git archive --format=tar HEAD > /tmp/module.tar
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch origin release
            git worktree add /tmp/release origin/release
            git -C /tmp/release checkout -B release
          else
            git worktree add --detach /tmp/release
            git -C /tmp/release checkout --orphan release
          fi
          # Everything replaced by the archive: files removed from main go away too
          git -C /tmp/release rm -rq --ignore-unmatch . || true
          find /tmp/release -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf /tmp/module.tar -C /tmp/release
          git -C /tmp/release add -A
          if git -C /tmp/release diff --cached --quiet; then
            echo "Nothing changed for the deployment"
            exit 0
          fi
          git -C /tmp/release commit -q -m "Release ${sha}: ${subject}"
          git -C /tmp/release push origin release
