# GitHub release with the module zip, installable from Dolibarr (Setup > Modules > Deploy an external module).
# Branches (doc/dev/development.md): work on develop; a freeze creates the branch X.Y of a series from develop
# (git push origin develop:1.135), release candidate then published series, FIX only, merged back into develop
# (dev/merge-series.sh). A version is published by a tag on its branch X.Y:
#   git tag v1.135.0 origin/1.135 && git push origin v1.135.0
# The tag must be the version of the descriptor and be on the branch X.Y of its series. Release marked Latest when it
# is the highest version, then the branch stable is moved on it (fast-forward only). Details in .github/release.sh.
# Can be run again by hand (Actions > release > Run workflow, on the tag).
# Stable links: .../releases/latest (page of the last release),
# .../releases/download/vX.Y.Z/module_inbox-X.Y.Z.zip (zip of a given version).
name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit (v7.0.1), Dependabot proposes the next ones
      - name: Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The secrets are given to this step only, never to the actions before it (audit INBX-108)
      - name: Zip, release and branch stable
        run: bash .github/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: inbox
          DESCRIPTOR: core/modules/modInbox.class.php
          TITLE: Inbox
          # Copy of the zip on SourceForge (download stats), skipped while the secret SF_SSH_KEY is not set
          SF_PROJECT: ${{ secrets.SF_SSH_KEY != '' && 'inbox-for-dolibarr' || '' }}
          SF_USER: ${{ vars.SF_USER }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
